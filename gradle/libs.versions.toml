[versions]
spock = "2.4-groovy-5.0"
junit-platform = "6.1.3"
sonarqube = "7.5.0.8588"
spotless = "8.10.3"
jspecify = "1.0.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
errorprone-plugin = "5.1.1"
nullaway-plugin = "3.3.0"
archunit = "1.5.1"
# Published compatibility floors: changes require an explicit maintainer decision.
jackson2-minimum = "2.21.7"
jackson3-minimum = "3.1.7"
jackson-annotations-minimum = "2.21"
# Test-only forward compatibility targets, maintained by Renovate.
jackson2-current = "2.22.3"
jackson3-current = "3.2.3"
groovy = "5.1.3"
json-schema-validator = "3.0.8"
json-schema-validator2 = "2.0.8"

[libraries]
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
groovy-json = { module = "org.apache.groovy:groovy-json", version.ref = "groovy" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
spotless-plugin = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
errorprone-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-plugin" }
nullaway-plugin = { module = "net.ltgt.nullaway:net.ltgt.nullaway.gradle.plugin", version.ref = "nullaway-plugin" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2-minimum" }
jackson2-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson2-minimum" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3-minimum" }
jackson2-current-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2-current" }
jackson2-current-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson2-current" }
jackson3-current-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3-current" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations-minimum" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
json-schema-validator2 = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator2" }

[plugins]
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
