name: Submit dependency graph

on:
  workflow_run:
    workflows: ['Generate dependency graph']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  dependency-submission:
    name: Submit dependency graph
    # A skipped same-repository PR producer has no artifact to consume.
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event != 'pull_request' || github.event.workflow_run.head_repository.full_name != github.repository) }}
    runs-on: ubuntu-latest
    steps:
      # Trusted consumer: download the official artifact, never check out or run PR code.
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
