name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require release GitHub App credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_APP_CLIENT_ID" || { echo "RELEASE_APP_CLIENT_ID repository variable is not set." >&2; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo "RELEASE_APP_PRIVATE_KEY repository secret is not set." >&2; exit 1; }
      - name: Create repository-scoped release App token
        id: release-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: kazforge
          repositories: jsonapi-java
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.release-app-token.outputs.token }}

  publish:
    name: Build, sign, and publish to Maven Central
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up JDK 21 (toolchain baseline)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Require signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "SIGNING_KEY is not set; refusing to publish unsigned artifacts." >&2; exit 1; }
      - name: Build, sign, and stage publications
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publish
      - name: Generate release-train CycloneDX SBOM
        run: ./gradlew cyclonedxBom
      - name: Attest primary release JAR build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/staging-deploy/com/kazforge/jsonapi-java-*/*/*.jar
            !build/staging-deploy/**/*-sources.jar
            !build/staging-deploy/**/*-javadoc.jar
            !build/staging-deploy/**/*-test-fixtures.jar
      - name: Attest primary release JARs with the aggregate CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/staging-deploy/com/kazforge/jsonapi-java-*/*/*.jar
            !build/staging-deploy/**/*-sources.jar
            !build/staging-deploy/**/*-javadoc.jar
            !build/staging-deploy/**/*-test-fixtures.jar
          sbom-path: build/reports/cyclonedx/bom.json
      - name: Assemble Central Portal bundle
        run: |
          test -d build/staging-deploy
          rm -f build/central-bundle.zip
          (export COPYFILE_DISABLE=1 && cd build/staging-deploy && zip -qr ../central-bundle.zip .)
      - name: Upload bundle to Maven Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          CENTRAL_TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')
          curl --fail-with-body --show-error \
            -H "Authorization: Bearer $CENTRAL_TOKEN" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC"

  docs-publish:
    name: Publish released documentation
    needs: [release-please, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docs-${{ github.repository }}-${{ needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Check out immutable software release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Create product and Portal App token
        id: docs-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: kazforge
          repositories: |
            jsonapi-java
            jsonapi-docs
          permission-contents: write
      - name: Publish immutable docs asset and notify Portal
        env:
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
          DOCS_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          [[ -n "$DOCS_TAG" && -f docs/site/index.md ]]
          [[ -z "$(find docs/site -type l -print -quit)" ]]
          source_sha="$(git rev-parse HEAD)"
          label="docs-source-sha=$source_sha;software-tag-sha=$source_sha"
          archive="$RUNNER_TEMP/docs-site.tar.gz"
          tar -C docs/site --format=gnu --sort=name --mtime='@0' --owner=0 --group=0 \
            --numeric-owner -cf - . | gzip -n > "$archive"
          [[ -s "$archive" ]]
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DOCS_TAG" \
            --jq '[.assets[] | select(.name == "docs-site.tar.gz")]')"
          count="$(jq 'length' <<< "$existing")"
          if [[ "$count" == 0 ]]; then
            gh release upload "$DOCS_TAG" "$archive#$label" --repo "$GITHUB_REPOSITORY"
          elif [[ "$count" == 1 ]]; then
            [[ "$(jq -r '.[0].label // ""' <<< "$existing")" == "$label" ]] || {
              echo "Conflicting documentation provenance; refusing overwrite" >&2
              exit 1
            }
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$DOCS_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern docs-site.tar.gz --dir "$RUNNER_TEMP/previous"
            cmp "$archive" "$RUNNER_TEMP/previous/docs-site.tar.gz"
          else
            echo "Duplicate docs assets on release $DOCS_TAG" >&2
            exit 1
          fi
          gh api --method POST repos/kazforge/jsonapi-docs/dispatches \
            -f event_type=docs-release-published
