name: Publish documentation revisions

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'

permissions:
  contents: read

jobs:
  publish:
    uses: kazforge/github-workflows/.github/workflows/publish-docs.yml@28a9b2ba8881cc753d0878567197078b034093a6
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
