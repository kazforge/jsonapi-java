name: PoC Spotless Preview

on:
  push:
    branches:
      - poc/kaz-137-mapping-domain

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Spotless
        run: ./gradlew spotlessApply
      - name: Emit formatted specs
        shell: bash
        run: |
          for file in \
            jsonapi-java-mapping/src/test/groovy/com/kazforge/jsonapi/mapping/internal/GenericCompoundInclusionEngineSpec.groovy \
            jsonapi-java-mapping/src/test/groovy/com/kazforge/jsonapi/mapping/internal/GenericDomainResourceBinderSpec.groovy \
            jsonapi-java-mapping/src/test/groovy/com/kazforge/jsonapi/mapping/internal/GenericDomainResourceWriterSpec.groovy
          do
            echo "FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:$file"
          done
