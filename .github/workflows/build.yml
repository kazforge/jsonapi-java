name: Java CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.gradle'
      - '**/*.groovy'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build-logic/**'
      - 'config/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
      - 'renovate.json'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Java/build-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            java:
              - '**/*.java'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.gradle'
              - '**/*.groovy'
              - 'build.gradle*'
              - 'settings.gradle*'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build-logic/**'
              - 'config/**'
              - '.github/workflows/build.yml'
              - '.github/scripts/**'
              - 'renovate.json'

  build:
    name: Build (Java ${{ matrix.java-version }})
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Compatibility targets, not Renovate-managed dependencies. The Gradle
        # toolchain baseline stays on Java 21; the 25 leg additionally runs the
        # test suite on a newer runtime.
        java-version: [21, 25]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Toolchain baseline: production compilation always targets Java 21.
      - name: Set up JDK 21 (toolchain baseline)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # CI runtime under test. Skipped on the 21 leg where the baseline already
      # provides the runtime; on the 25 leg this leaves JAVA_HOME on 25 while
      # the 21 toolchain installation remains available for compilation.
      - name: Set up JDK ${{ matrix.java-version }} (CI runtime)
        if: ${{ matrix.java-version != 21 }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build & Test (Java ${{ matrix.java-version }})
        run: ./gradlew clean spotlessCheck build -PtestJavaVersion=${{ matrix.java-version }}
      - name: Sonar Scan (Java 21 only)
        if: ${{ matrix.java-version == 21 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar
      # SonarCloud free-tier Quality Gate can stay green with new smells; fail closed on Issues API.
      - name: Verify zero new-code Sonar issues
        if: ${{ matrix.java-version == 21 }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: .github/scripts/check-new-code-issues.sh --list
      - name: Upload build reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-reports-java-${{ matrix.java-version }}
          path: |
            **/build/reports/dependency-verification/**
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Unit tests (Java ${{ matrix.java-version }})
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-error: 'false'

  jackson-current:
    name: Jackson current compatibility (Java ${{ matrix.java-version }})
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up JDK ${{ matrix.java-version }} (test runtime)
        if: ${{ matrix.java-version != 21 }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test current Jackson compatibility
        run: ./gradlew :jsonapi-java-jackson3:test -PjacksonTestVersion=current -PtestJavaVersion=${{ matrix.java-version }}
      - name: Upload current Jackson test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-reports-jackson-current-java-${{ matrix.java-version }}
          path: |
            **/build/reports/dependency-verification/**
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
      - name: Publish current Jackson test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Unit tests (Jackson current, Java ${{ matrix.java-version }})
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-error: 'false'

  # Stable required check; matrix jobs may be skipped before expansion.
  required:
    name: Java CI required
    needs: [changes, build, jackson-current]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Java CI gate
        run: |
          test "${{ needs.changes.result }}" = "success"
          if test "${{ needs.changes.outputs.java }}" = "true"; then
            test "${{ needs.build.result }}" = "success"
            test "${{ needs.jackson-current.result }}" = "success"
          fi
