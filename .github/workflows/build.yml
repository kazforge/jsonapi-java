name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Lightweight change detection: the expensive Java matrix only runs when
  # Java/build-relevant files changed. The "Java CI required" gate job below is
  # the stable ruleset required check; the matrix leg names are not.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Java/build-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            java:
              - '**/*.java'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.gradle'
              - '**/*.groovy'
              - 'build.gradle*'
              - 'settings.gradle*'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build-logic/**'
              - 'config/**'
              - '.github/workflows/build.yml'
              - '.github/scripts/**'
              - 'renovate.json'

  build:
    name: Build (Java ${{ matrix.java-version }})
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Compatibility targets, not Renovate-managed dependencies. The Gradle
        # toolchain baseline stays on Java 21; the 25 leg additionally runs the
        # test suite on a newer runtime.
        java-version: [21, 25]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Toolchain baseline: production compilation always targets Java 21.
      - name: Set up JDK 21 (toolchain baseline)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      # CI runtime under test. Skipped on the 21 leg where the baseline already
      # provides the runtime; on the 25 leg this leaves JAVA_HOME on 25 while
      # the 21 toolchain installation remains available for compilation.
      - name: Set up JDK ${{ matrix.java-version }} (CI runtime)
        if: ${{ matrix.java-version != 21 }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build & Test (Java ${{ matrix.java-version }})
        run: ./gradlew clean spotlessCheck build -PtestJavaVersion=${{ matrix.java-version }}
      - name: Sonar Scan (Java 21 only)
        if: ${{ matrix.java-version == 21 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar
      # SonarCloud free-tier Quality Gate can stay green with new smells; fail closed on Issues API.
      - name: Verify zero new-code Sonar issues
        if: ${{ matrix.java-version == 21 }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: .github/scripts/check-new-code-issues.sh --list
      - name: Upload build reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-reports-java-${{ matrix.java-version }}
          path: |
            **/build/reports/dependency-verification/**
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Unit tests (Java ${{ matrix.java-version }})
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-error: 'false'

  # Stable, always-created gate for ruleset required checks. jobs.<job>.if is
  # evaluated before matrix expansion, so a skipped matrix leg might never
  # create its check run; this job always exists and passes without running
  # build work when no Java/build-relevant files changed. It fails when change
  # detection failed, or when the matrix ran but did not succeed. Configure
  # "Java CI required" as the required check, not "Build (Java 21/25)".
  required:
    name: Java CI required
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Java CI gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JAVA_CHANGES: ${{ needs.changes.outputs.java }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection did not succeed (result: $CHANGES_RESULT)."
            exit 1
          fi
          if [[ "$JAVA_CHANGES" == "true" && "$BUILD_RESULT" != "success" ]]; then
            echo "::error::Java/build-relevant changes detected but matrix result is '$BUILD_RESULT'."
            exit 1
          fi
          echo "Gate passed (matrix: $BUILD_RESULT)."
