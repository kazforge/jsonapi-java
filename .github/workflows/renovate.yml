name: Renovate

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency: renovate

jobs:
  renovate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RENOVATE_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-statuses: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-administration: read
          permission-vulnerability-alerts: read
          permission-members: read
      - name: Run Renovate
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:45.3.2@sha256:d0358088501c7665688673c8932474b02517941703a16e970e8b4fcf235299cb
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: gradleWrapper
          RENOVATE_BRANCH_PREFIX: renovate-actions/
          # Disable fallback adoption of Mend's renovate/ branches during overlap.
          RENOVATE_BRANCH_PREFIX_OLD: renovate-actions/
          # The Java 21 toolchain is declared in shared build logic, not the root build file.
          RENOVATE_CONSTRAINTS: '{"java":"21"}'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
          RENOVATE_CONFIG_VALIDATION_ERROR: 'true'
