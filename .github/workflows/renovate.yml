name: Renovate

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency: renovate

jobs:
  renovate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RENOVATE_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-statuses: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-administration: read
          permission-vulnerability-alerts: read
          permission-members: read
      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.138.0@sha256:32027ed5e5e450f76ee372fcd6e72c8114db7fdb28c97c520515a03ea4a0d77b
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: gradleWrapper
          RENOVATE_BRANCH_PREFIX: renovate-actions/
          # Disable fallback adoption of Mend's renovate/ branches during overlap.
          RENOVATE_BRANCH_PREFIX_OLD: renovate-actions/
          # The Java 21 toolchain is declared in shared build logic, not the root build file.
          RENOVATE_CONSTRAINTS: '{"java":"21"}'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
          RENOVATE_CONFIG_VALIDATION_ERROR: 'true'
