name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Fork pull_request tokens are read-only even when this job requests write.
    # Only same-repository PRs execute the direct submission steps.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          persist-credentials: false
      - name: Set up JDK 21
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Submit resolved Gradle dependencies
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          additional-arguments: --no-daemon --no-configuration-cache
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          warn-only: false
          # Only fork PRs wait for the separate trusted workflow_run submission.
          retry-on-snapshot-warnings: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          retry-on-snapshot-warnings-timeout: 600
          license-check: false
          show-openssf-scorecard: false
          comment-summary-in-pr: never
