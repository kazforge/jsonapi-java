name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect documentation-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - 'docs/site/**'
              - 'docs/requirements.txt'
              - 'mkdocs.yml'
              - '.github/workflows/docs-pages.yml'

  build:
    name: Documentation build
    needs: changes
    # Manual docs runs always build because there is no PR diff.
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install documentation dependencies
        run: "python -m pip install --only-binary :all: --require-hashes --requirement docs/requirements.txt"
      - name: Build documentation site
        run: mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/docs-site

  deploy:
    name: Documentation deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Stable required check; the build job may be skipped. Does not depend on
  # deployment, which is not a PR concern.
  required:
    name: Documentation required
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify documentation gate
        run: |
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.changes.outputs.docs }}" != "true" \
            || test "${{ needs.build.result }}" = "success"
