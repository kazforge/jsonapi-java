name: Generate dependency graph

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-graph:
    name: Dependency graph
    # Same-repository PRs submit in Dependency Review before checking the diff.
    # Fork PRs still need this read-only producer and the trusted workflow_run consumer.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false
      - name: Resolve the default dependency graph
        run: ./gradlew --no-daemon --no-configuration-cache :ForceDependencyResolutionPlugin_resolveAllDependencies
